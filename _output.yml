bookdown::gitbook:
  css: style.css
  pandoc_args: ["--math-method=mathjax"]
  config:
    toc:
      before: |
        <li><a href="./">Rete Ecologica Comunale Spoleto</a></li>
      after: |
        <li><a href="https://bioglp.github.io/RECSpoleto/index.html" target="blank">Relazione 2025</a></li>
        <li><a href="https://bioglp.github.io/RECSpoleto_relazione2026/index.html" target="blank">Relazione 2026</a></li>
    download: ["pdf", "epub"]
bookdown::pdf_book:
  pandoc_args: [
   "-V", "papersize=a4"
  ]
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  lang: it
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
